# Single-binary Tempo on local disk. Fine for one developer; nothing here is production sizing.
stream_over_http_enabled: true

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc: { endpoint: 0.0.0.0:4317 }
        http: { endpoint: 0.0.0.0:4318 }

storage:
  trace:
    backend: local
    wal: { path: /var/tempo/wal }
    local: { path: /var/tempo/blocks }

# RED metrics and the service graph, derived from spans and pushed into Prometheus. This is why
# Prometheus runs with --web.enable-remote-write-receiver.
metrics_generator:
  registry:
    external_labels: { source: tempo }
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces
  processor:
    # TraceQL metrics, which Grafana's Traces drilldown is built on, read these blocks. Every
    # span, not only server ones, so a service span's rate and latency can be asked about too.
    local_blocks:
      filter_server_spans: false
      flush_to_storage: true

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics, local-blocks]
