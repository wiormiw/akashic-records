apiVersion: 1

# Fixed uids so the cross-links below, and any dashboard, can name each other.
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      # Tempo's metrics-generator labels exemplars `traceID`: a dot on a latency graph opens it.
      exemplarTraceIdDestinations:
        - { name: traceID, datasourceUid: tempo }

  - name: Tempo
    uid: tempo
    type: tempo
    url: http://tempo:3200
    jsonData:
      serviceMap: { datasourceUid: prometheus }
      nodeGraph: { enabled: true }
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
      tracesToMetrics:
        datasourceUid: prometheus

  - name: Loki
    uid: loki
    type: loki
    url: http://loki:3100
    jsonData:
      derivedFields:
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: tempo
          url: "$${__value.raw}"
