# The API, at two replicas.
#
# Two is the number the design was checked against rather than a default. The work that made it
# safe: sessions live in Postgres, rate-limit counters in Redis, outbox claiming is a guarded
# UPDATE so several dispatchers cannot take the same message, and room messages cross between
# pods over a Redis channel because a Bun pub/sub topic lives inside one process.
#
# That last one was a real bug until recently. Without the relay, two participants whose sockets
# landed on different pods simply never saw each other's messages until a page reload — quietly,
# because the message was still stored.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: akashic
  labels:
    app: api
spec:
  replicas: 2

  # Surge one, lose none. With two replicas a rolling update that allows an unavailable pod runs
  # the service at half capacity for the length of the roll; surging instead costs one pod's worth
  # of resource for a minute and keeps both serving.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: api

  template:
    metadata:
      labels:
        app: api
    spec:
      # Spread across nodes where possible. Two replicas on one node survive a process crash and
      # not a node failure, which is the failure that actually takes a cluster down.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: api

      # Long enough for in-flight requests to finish. The shutdown hooks stop the server without
      # severing live requests, drain the dispatcher and close the pool; cutting that short turns a
      # deploy into a handful of failed requests for whoever was mid-page.
      terminationGracePeriodSeconds: 45

      containers:
        - name: api
          image: ghcr.io/wiormiw/akashic-api:latest

          ports:
            - name: http
              containerPort: 3000

          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secrets

          # Liveness touches nothing slow, deliberately. A probe that queries Postgres restarts a
          # perfectly healthy container every time the database hiccups, turning one outage into
          # two.
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

          # Readiness does check dependencies, which is the difference between the two: a pod that
          # cannot reach Postgres should stop receiving traffic without being killed, because the
          # fix is for Postgres to come back rather than for this pod to restart.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          # Startup is separate so a slow boot never trips liveness. Without it, the liveness
          # probe's failure threshold has to be loose enough to cover the worst cold start, which
          # makes it useless for detecting a genuinely wedged process afterwards.
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 3
            failureThreshold: 20

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              # No CPU limit on purpose: throttling a request-serving process adds latency that
              # looks like a slow database. The request is what the scheduler packs on.
              memory: 512Mi

          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: akashic
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: http

---
# Keeps one pod serving during voluntary disruption — a node drain, a cluster upgrade.
#
# Without it, draining a node that happens to hold both replicas evicts both at once, and the
# rolling-update settings above do nothing because this is not an update.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: akashic
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api
