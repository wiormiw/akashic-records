# The VPS stack: Caddy in front, the API behind it, and the data services on an internal network.
#
# On the VPS this file sits in /opt/akashic beside `.env` (the API's whole environment, one
# GitHub secret). `deploy/up-local.sh` runs the same file on a laptop against `.env.local`.
#
# Only Caddy publishes ports. Every data service is reachable from this project's network and
# nowhere else, which is what makes OpenFGA's missing authentication below acceptable.
# The project name keeps containers, networks and volumes apart from the dev `compose.yaml`
# (project `akashic`), so both can run at once.

name: akashic-prod

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: akashic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file}
      POSTGRES_DB: akashic
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # An actual query: pg_isready is true while the first init pass is still running.
      test: ["CMD-SHELL", "psql -U akashic -d akashic -c 'SELECT 1' || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  # OpenFGA's own database, so two migration tools never share one schema.
  openfga-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: openfga
      POSTGRES_PASSWORD: ${OPENFGA_DB_PASSWORD:?set OPENFGA_DB_PASSWORD in the env file}
      POSTGRES_DB: openfga
    volumes:
      - openfga-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "psql -U openfga -d openfga -c 'SELECT 1' || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  # Runs to completion and exits; the server waits on that exit, not on a port.
  # Same tag and digest as the dev compose.yaml. Bump both together.
  openfga-migrate:
    image: openfga/openfga:v1.21.0@sha256:2113c664a486b5da8d7a2cdab479e0d4e30639c80fd2c000540f645c1dbc1e55
    command: migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:${OPENFGA_DB_PASSWORD}@openfga-db:5432/openfga?sslmode=disable
    depends_on:
      openfga-db:
        condition: service_healthy
    restart: on-failure

  openfga:
    image: openfga/openfga:v1.21.0@sha256:2113c664a486b5da8d7a2cdab479e0d4e30639c80fd2c000540f645c1dbc1e55
    command: run
    restart: unless-stopped
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:${OPENFGA_DB_PASSWORD}@openfga-db:5432/openfga?sslmode=disable
      OPENFGA_LOG_FORMAT: json
      # No authentication, because the API has no setting for a token. That is safe only because
      # this service publishes no port and sits on the stack's internal network: anything that
      # could reach it could grant itself any role in any realm. Never add a `ports:` entry.
      OPENFGA_AUTHN_METHOD: none
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=:8081"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No persistence: only rate-limit counters live here, and losing them on restart is correct.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: akashic
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in the env file}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    # Locally `up-local.sh` points API_IMAGE at the image it just built.
    image: ${API_IMAGE:-ghcr.io/wiormiw/akashic-api:latest}
    restart: unless-stopped
    # The API drains and exits within SHUTDOWN_TIMEOUT_MS (15s by default); this must exceed it,
    # or Docker kills a process that was about to exit cleanly.
    stop_grace_period: 30s
    env_file: ${API_ENV_FILE:-.env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      openfga:
        condition: service_healthy

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      # api.example.com on the VPS (automatic HTTPS); http://localhost:8300 locally.
      API_SITE_ADDRESS: ${API_SITE_ADDRESS:?set API_SITE_ADDRESS in the env file}
    ports:
      # On the VPS the defaults apply. Locally the env file binds loopback only and maps the
      # plain-HTTP listener, since the site address there names the port itself.
      - "${CADDY_HTTP:-80}:${CADDY_HTTP_INNER:-80}"
      - "${CADDY_HTTPS:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The certificates: losing this volume means re-issuing them, and Let's Encrypt rate-limits.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy

  # Local rehearsal only (`--profile web`). In production the web runs on Vercel.
  web:
    profiles: [web]
    image: ${WEB_IMAGE:-akashic-web:local}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        PUBLIC_API_BASE: ${PUBLIC_API_BASE:-http://localhost:8300}
        PUBLIC_MEDIA_ORIGIN: ${PUBLIC_MEDIA_ORIGIN:-}
    # The web server calls the API at the same address the browser uses, http://localhost:8300.
    # Inside a bridge-network container "localhost" is the container itself, so this shares the
    # host's network and reaches Caddy's loopback port. HOST keeps it off the LAN.
    network_mode: host
    environment:
      PORT: ${WEB_PORT:-8301}
      HOST: 127.0.0.1
    healthcheck:
      # The image's own check probes port 3000.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${PORT}/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s

volumes:
  postgres-data:
  openfga-data:
  rabbitmq-data:
  caddy-data:
  caddy-config:
