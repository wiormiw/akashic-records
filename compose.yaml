# Local dependencies: Postgres, Redis, OpenFGA, MinIO and the observability stack.
# `docker compose up -d`, then `bun run dev` on the host. `--profile app` runs the API image too.

name: akashic

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: akashic
      POSTGRES_PASSWORD: akashic
      POSTGRES_DB: akashic
    ports:
      # Loopback only. Deliberately NOT "5432:5432", which binds 0.0.0.0 and offers Postgres to
      # the whole LAN.
      #
      # To reach this from pods in a local kind cluster (deploy/k8s/external-services.yaml), add
      # a second binding on that network's gateway. Look the address up rather than assuming it:
      # Docker assigns one per network, and a binding on an address that does not exist on this
      # machine fails the entire `compose up`, not just the one service.
      #   docker network inspect kind -f "{{range .IPAM.Config}}{{.Gateway}} {{end}}"
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` alone returns true while the DB is still starting up its first init pass,
      # so an actual query is used. Everything else waits on this.
      test: ["CMD-SHELL", "psql -U akashic -d akashic -c 'SELECT 1' || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  # OpenFGA, the authorization service. See docs/AUTHZ.md.
  #
  # Its own database, not a schema in the application one. Two reasons, and the second is the
  # real one: OpenFGA runs its own migrations against whatever it is pointed at, so sharing a
  # database would mean two migration tools writing one schema and racing on one migrations
  # table. The first is plainer -- tuples are OpenFGA's to model, and a JOIN from application
  # tables into them is exactly the coupling that makes the service impossible to replace.
  openfga-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: openfga
      POSTGRES_PASSWORD: openfga
      POSTGRES_DB: openfga
    volumes:
      - openfga-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "psql -U openfga -d openfga -c 'SELECT 1' || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  # A separate migration container, for the same reason apps/migrator is a separate package:
  # replicas racing to migrate on boot is how a schema gets corrupted. It runs to completion and
  # exits, and the server waits on that exit rather than on a port being open.
  openfga-migrate:
    image: openfga/openfga:latest
    command: migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:openfga@openfga-db:5432/openfga?sslmode=disable
    depends_on:
      openfga-db:
        condition: service_healthy
    restart: on-failure

  openfga:
    image: openfga/openfga:latest
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:openfga@openfga-db:5432/openfga?sslmode=disable
      OPENFGA_LOG_FORMAT: json
      # No authentication on the local stack. In a cluster this listens on a ClusterIP with no
      # Ingress, the same assumption the Go services run under -- see docs/SPLIT.md. Anything
      # that can reach this port can grant itself any role in any realm.
      OPENFGA_AUTHN_METHOD: none
    ports:
      # Loopback only, and read the comment on postgres above before changing it: a permission
      # service offered to the LAN is every permission offered to the LAN.
      - "127.0.0.1:8080:8080"   # HTTP API, what the SDK calls
      - "127.0.0.1:3001:3000"   # playground, for reading the model and trying checks by hand
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=:8081"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    # No persistence: everything here is a rate-limit counter, and losing them on restart is
    # correct behaviour rather than data loss.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      # Loopback only, same reasoning as postgres above.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      # guest may only connect from inside the container, and a published port isn't that.
      RABBITMQ_DEFAULT_USER: akashic
      RABBITMQ_DEFAULT_PASS: akashic
    ports:
      # Loopback only, same reasoning as postgres above. 15672 is the management UI.
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 20

  # MinIO stopped publishing images to Docker Hub (minio/minio and minio/mc are gone); Chainguard
  # builds it from source. Its entrypoint is the minio binary, and it ships mc and a shell, so
  # the health check and minio-init below need no second image.
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: akashic
      MINIO_ROOT_PASSWORD: akashic-dev-secret
      # mc has no built-in `local` alias here; this defines it for the health check.
      MC_HOST_local: http://akashic:akashic-dev-secret@localhost:9000
    ports:
      # Loopback only, same reasoning as postgres above.
      # 9001 is the browser console — handy for seeing what actually landed in the bucket.
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Creates the bucket and opens it for reading. Runs once and exits, like `migrate` below.
  #
  # Public-read is right for what goes in here — listing photos and event banners are shown to
  # anyone who can see the posting, and a signed URL per image would buy nothing while costing a
  # round trip. Private material does not belong in this bucket at all.
  minio-init:
    image: cgr.dev/chainguard/minio:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        mc alias set local http://minio:9000 akashic akashic-dev-secret
        mc mb --ignore-existing local/akashic
        mc anonymous set download local/akashic

  # --- observability -------------------------------------------------------------------------
  # Deliberately the SAME topology as production: the app talks only to the Collector, and the
  # Collector fans out. A dev setup where the app exports straight to a UI is a different
  # pipeline, so it proves nothing about whether the real one works.

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    command: ["--config=/etc/otel/collector.yaml"]
    volumes:
      - ./deploy/observability/collector.yaml:/etc/otel/collector.yaml:ro
      # Read-only access to container logs, which is how the filelog receiver collects pino
      # output — the same mechanism a DaemonSet agent uses in Kubernetes.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # Where `bun run dev` tees its JSON logs. This is what gives host-run development the same
      # log pipeline as a container, without running the app in one.
      - ./logs:/var/log/akashic:ro
      # animerec shares this stack. Point ANIMEREC_LOGS elsewhere if the repos aren't siblings.
      - ${ANIMEREC_LOGS:-../animerec_api/logs}:/var/log/animerec:ro
    ports:
      - "4318:4318" # OTLP/HTTP — what OTEL_EXPORTER_OTLP_ENDPOINT points at
      - "4317:4317" # OTLP/gRPC
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "--version"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      tempo:
        condition: service_healthy
      loki:
        condition: service_healthy

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./deploy/observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3200/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  loki:
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./deploy/observability/loki.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3100/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
      - "--storage.tsdb.path=/prometheus"
      # Required for Tempo's metrics-generator to push RED metrics in.
      - "--web.enable-remote-write-receiver"
      - "--enable-feature=exemplar-storage"
    volumes:
      - ./deploy/observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  grafana:
    # 12.x ships the Metrics, Logs and Traces drilldown apps; 11.4 had no traces page at all.
    image: grafana/grafana:12.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      # Enables the trace <-> log <-> metric jumps configured in datasources.yaml.
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
      # Open on the overview rather than an empty welcome page.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/api-overview.json
    volumes:
      - ./deploy/observability/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./deploy/observability/grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000" # 3000 is the API's port on the host
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      - tempo
      - loki
      - prometheus

volumes:
  postgres-data:
  rabbitmq-data:
  openfga-data:
  minio-data:
  tempo-data:
  loki-data:
  prometheus-data:
  grafana-data:
